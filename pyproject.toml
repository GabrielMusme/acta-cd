[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "acta-cd"
version = "0.1.0"
description = "Intelligent Meeting Minutes Engine MVP baseline"
readme = "docs/99-project-context.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.116.1",
    "pydantic==2.11.7",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "ruff==0.12.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "phase1_gate: consolidated Phase 1 go/no-go gate subset",
    "phase1_invariants: invariant-focused tests for Domain Model DMI rules",
    "phase1_fact_immutability: Business Fact immutability and append-only behavior tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
